[Nameplates]
; 1 = on. ToggleKey is a Windows virtual-key code (117 = F6; V is taken by the game).
Enabled=1
ToggleKey=117
; Which creatures get a plate. Hostile (red) always; neutral (yellow - townsfolk, but also enemies before a fight
; starts) and friendly (green: party, allies) only when hovered/targeted unless set to 1.
ShowNeutral=0
ShowFriendly=0
; Hostiles get a plate whenever the game draws them (= you could click them) up to Range metres from the
; player (WoW: 40-60 yd). OnlyVisible=0 also plates creatures in culled rooms / off-view. Target always keeps one.
Range=60
OnlyVisible=1
; Labels on interactive objects: containers/remains (gold + sparkle while they hold loot, grey once empty), items on
; the ground (gold), terminals/workbenches/other usable placeables (cyan). Doors are off by default.
ShowObjects=1
ShowDoors=0
HideEmpty=0
ObjectRange=40
ObjectNameSize=15
; Sizes are at 1440 px GUI height and scale with it; Scale multiplies everything.
Scale=1.0
BarWidth=132
BarHeight=11
NameSize=17
TargetScale=1.2
; Plates of non-targets fade to this when something is targeted.
OtherAlpha=0.7
; Percent text inside the target's bar.
HealthText=1
; Push overlapping plates apart vertically.
StackPlates=1
; Metres above the model's head.
HeadLift=0.25
Font=Bahnschrift SemiBold
Debug=0
